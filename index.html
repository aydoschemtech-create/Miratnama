<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Video QR</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  #talk { position:fixed; bottom:20%; left:50%; transform:translateX(-50%); width:60%; z-index:1; }
  #playBtn { position:fixed; bottom:10%; left:50%; transform:translateX(-50%); font-size:18px; padding:12px 20px; z-index:10; cursor:pointer; background:#fff; border:none; border-radius:8px; }
</style>
</head>
<body>

<!-- Video -->
<video id="talk" playsinline loop preload="auto">
  <source src="video.webm" type="video/webm">
  Sizning brauzeringiz video qo‘llab-quvvatlamaydi.
</video>

<!-- Play tugmasi -->
<button id="playBtn">▶ play</button>

<script>
const video = document.getElementById("talk");
const btn = document.getElementById("playBtn");

// Tugma bosilganda video ishlaydi
btn.addEventListener("click", () => {
  // brauzer autoplay siyosatiga binoan mute ni olib tashlash
  video.muted = false;
  video.volume = 1.0;
  video.play().catch(err => console.log(err)); // xatolik bo‘lsa logga chiqadi
  btn.style.display = "none"; // tugmani yashirish
});
</script>

</body>
</html>
